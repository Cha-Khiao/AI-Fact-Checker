<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Inner Subtle Glass Glow -->
  <rect x="4" y="4" width="56" height="28" rx="14" fill="white" fill-opacity="0.12" />

  <!-- Shield Shape -->
  <path d="M32 12L46 17V30C46 41.5 39.5 49 32 52C24.5 49 18 41.5 18 30V17L32 12Z" fill="#0C1A30" fill-opacity="0.4" stroke="#A5F3FC" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Checkmark Inside Shield -->
  <path d="M25 31.5L29.5 36L39 25" stroke="#E0F2FE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
